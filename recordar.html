<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Confirmar recordatorio</title>
<!--
  ============================================================================
  MaxRecuerda — «YA LO HICE», desde el WhatsApp
  ============================================================================
  Una sola pantalla, un solo toque. El enlace llega en el mensaje y el token
  ES la credencial: 64 caracteres de un generador criptográfico, no un número
  correlativo. Con un id correlativo, cualquiera cerraría los pendientes de
  todo el mundo probando números.

  Lo único que esta página puede hacer es marcar HECHO ese aviso. No lee datos,
  no lista nada, no borra nada: llama a una sola función que hace una sola cosa.

  ⚠️ AL INSTALARLA: la anon key tiene que ser LA MISMA que usa la app. En
  Betangar ya hubo un 401 silencioso por dejar una key vieja en `chofer.html`
  y los viajes no subían. Si esta página dice «enlace inválido» para TODOS los
  enlaces, lo primero que hay que probar es la key con curl: 401 = revocada.
  ============================================================================
-->
<style>
  :root{
    --f:#f6f7f9; --p:#fff; --b:#e3e7ec; --t:#10151c; --t2:#56616f; --t3:#8b96a4;
    --ok:#079455; --ok-b:#ecfdf3; --mal:#d92d20; --mal-b:#fef3f2;
    --s:0 8px 24px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --f:#0d1117; --p:#161b22; --b:#262d38; --t:#e9edf2; --t2:#9aa5b4; --t3:#6e7a8a;
           --ok-b:#0d2419; --mal-b:#2b1414; --s:0 12px 40px rgba(0,0,0,.5); }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--f); color:var(--t);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:grid; place-items:center; padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  .caja{
    background:var(--p); border:1px solid var(--b); border-radius:18px;
    box-shadow:var(--s); padding:34px 28px; width:100%; max-width:420px; text-align:center;
  }
  .ic{ font-size:56px; line-height:1; margin-bottom:14px }
  h1{ font-size:20px; font-weight:700; letter-spacing:-.02em; margin:0 0 6px }
  p{ color:var(--t2); margin:0 0 4px; font-size:14.5px }
  .titulo{
    background:var(--f); border:1px solid var(--b); border-radius:12px;
    padding:14px 16px; margin:18px 0 6px; font-weight:650; font-size:16px;
  }
  .sello{
    display:inline-flex; align-items:center; gap:7px; margin-top:16px;
    background:var(--ok-b); color:var(--ok); border-radius:999px;
    padding:7px 16px; font-weight:700; font-size:13.5px;
  }
  .sello.mal{ background:var(--mal-b); color:var(--mal) }
  .pie{ margin-top:22px; font-size:12px; color:var(--t3) }
  .spin{
    width:26px;height:26px;border:3px solid var(--b);border-top-color:var(--ok);
    border-radius:50%;animation:g .7s linear infinite;margin:8px auto
  }
  @keyframes g{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .spin{animation-duration:2.5s} }
</style>
</head>
<body>
  <div class="caja" id="caja">
    <div class="spin"></div>
    <p>Un momento…</p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // ⚠️ RELLENAR AL INSTALAR — la MISMA anon key que usa la app.
  var SUPABASE_URL  = 'https://hrkjddehqnzcqwlkklqm.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhya2pkZGVocW56Y3F3bGtrbHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTk1NzIsImV4cCI6MjA5MzIzNTU3Mn0.kqWKthyZfPZ86toql7shGByF-ZhUpcQUS4Jw4RnG_ko';

  var caja = document.getElementById('caja');

  function pintar(ic, tit, txt, sello, malo){
    caja.innerHTML =
      '<div class="ic">'+ic+'</div>'+
      '<h1>'+tit+'</h1>'+
      (txt ? '<div class="titulo">'+txt+'</div>' : '')+
      (sello ? '<div class="sello'+(malo?' mal':'')+'">'+sello+'</div>' : '')+
      '<div class="pie">Puedes cerrar esta ventana.</div>';
  }

  var t = new URLSearchParams(location.search).get('t') || '';
  if (t.length < 32) {
    pintar('🔗','Enlace inválido','','No se pudo leer el enlace', true);
    return;
  }

  if (SUPABASE_URL.indexOf('__') === 0) {
    // Que la página esté sin configurar NO puede parecerse a «ya estaba hecho».
    pintar('⚙️','Falta configurar esta página','',
           'recordar.html sin credenciales', true);
    return;
  }

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  sb.rpc('rec_confirmar_por_token', { p_token: t }).then(function(r){
    if (r.error || !r.data || !r.data.ok) {
      pintar('⚠️','No se pudo confirmar','',
             (r.data && r.data.motivo) || 'Enlace inválido o vencido', true);
      return;
    }
    var d = r.data;
    pintar('✅',
      d.ya_estaba ? 'Ya estaba confirmado' : '¡Listo, gracias!',
      d.titulo ? escapar(d.titulo) : '',
      d.ya_estaba ? 'Sin cambios' : 'Marcado como hecho');
  }).catch(function(){
    pintar('📡','No hay conexión','','Vuelve a tocar el enlace', true);
  });

  function escapar(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
})();
</script>
</body>
</html>
