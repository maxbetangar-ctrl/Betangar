# verify_jwt de cada Edge Function, FIJADO A PROPOSITO.
#
# El CLI despliega con verify_jwt = true por defecto. Las funciones que se
# llaman sin JWT (webhooks, crons externos) estan en false, y ese valor no
# vivia en ningun lado del repo: solo en el proyecto. Un `functions deploy`
# las ponia en true y dejaban de responder en silencio.
#
# Valores tomados de lo DESPLEGADO el 2026-08-12. Al crear una funcion nueva,
# agregala aca: si no esta, hereda el default y vuelve la trampa.

